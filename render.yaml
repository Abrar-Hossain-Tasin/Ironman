services:
  - type: web
    name: ironman-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    healthCheckPath: /api/v1/health
    envVars:
      - key: PORT
        value: "8080"
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: STRICT_ENV_VALIDATION
        value: "true"
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: AUTH_COOKIE_SAME_SITE
        value: None
      - key: ALLOWED_ORIGINS
        sync: false
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: PAYMENT_WEBHOOK_SECRET
        sync: false
      - key: PAYMENT_WEBHOOK_BKASH_SECRET
        sync: false
      - key: PAYMENT_WEBHOOK_NAGAD_SECRET
        sync: false
      - key: PAYMENT_WEBHOOK_ROCKET_SECRET
        sync: false
      - key: PAYMENT_WEBHOOK_CARD_SECRET
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: production
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: "0.10"
      - key: MAIL_ENABLED
        value: "false"
      - key: RESEND_API_KEY
        sync: false
